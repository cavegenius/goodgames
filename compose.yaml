services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: goodgames:latest
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Your Game Lists}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Run scripts/start.sh to create .env.docker first}
      APP_URL: ${APP_URL:-https://localhost}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-goodgames}
      DB_USERNAME: ${MYSQL_USER:-goodgames}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      QUEUE_CONNECTION: sync
      FILESYSTEM_DRIVER: local
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Your Game Lists}
      STEAM_KEY: ${STEAM_KEY:-}
      IGDB_KEY: ${IGDB_KEY:-}
      PSN_KEY: ${PSN_KEY:-}
      XBOX_KEY: ${XBOX_KEY:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-goodgames}
      MYSQL_USER: ${MYSQL_USER:-goodgames}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  app-storage:
